name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (MinGW-w64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Build
        shell: msys2 {0}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      # Desktop interaction tests are run manually on an unlocked Windows desktop.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path build/WindowFinder.exe, README.md, LICENSE -DestinationPath dist/WindowFinder-windows-x64.zip
          $digest = (Get-FileHash dist/WindowFinder-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  WindowFinder-windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WindowFinder-windows-x64
          path: dist/*
          if-no-files-found: error
